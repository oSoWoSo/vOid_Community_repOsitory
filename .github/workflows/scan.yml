name: scan updates

# Opens a `package-update` issue for every whitelisted template that has a
# newer upstream release. Detection only -- no privileged container, no
# bootstrap, no template editing: autobump.yml reacts to the issue and does
# the actual version/checksum rewrite.
#
# The candidate versions come from ./xbps-src update-check, i.e. from each
# template's own `update` file (site/pattern/ignore). Nothing here guesses from
# release flags: GitHub's `prerelease` field says false for brave v1.99.31
# while /releases/latest is still v1.97.56, so flag filtering bumps too much.

on:
  schedule:
    # 04:17 UTC -- off the :00 spike, the version sites we poll have no
    # published rate limits for us but do share runner IPs with other jobs.
    - cron: '17 4 * * *'
  workflow_dispatch:
    inputs:
      pkg:
        description: 'Only scan this package (empty = whole whitelist)'
        required: false
        default: ''
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: scan-updates
  cancel-in-progress: false

jobs:
  scan:
    name: Scan for updates
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Detect newer versions
        id: scan
        env:
          GITHUB_TOKEN: ${{ secrets.BOT }}
          SCAN_PKG: ${{ inputs.pkg }}
        run: |
          set -uo pipefail

          mkdir -p out

          mapfile -t pkgs < <(
            grep -vE '^\s*(#|$)' src/autobump-pkgs
          )

          if [ -n "$SCAN_PKG" ]; then
            pkgs=("$SCAN_PKG")
          fi

          echo "Scanning ${#pkgs[@]} template(s)"

          for pkg in "${pkgs[@]}"; do
            # srcpkgs holds symlinked aliases (hyprland-devel, libpng-devel,
            # sfizz-*). detect-update.sh refuses them, but check here too so
            # the lint and the scanner agree on what is bumpable.
            if [ -L "srcpkgs/$pkg" ]; then
              echo "::notice::$pkg is a symlinked alias, skipping"
              continue
            fi

            if ! out=$(.github/scripts/detect-update.sh "$pkg" "$GITHUB_WORKSPACE"); then
              echo "::warning::$pkg: detection failed, skipping"
              continue
            fi

            if [ -z "$out" ]; then
              echo "$pkg: up to date"
              continue
            fi

            # "<pkg> <old> <new>"
            read -r name old new <<<"$out"
            echo "$name $old $new" >>out/found
            echo "$name: $old -> $new"
          done

          if [ ! -s out/found ]; then
            echo "Nothing to bump."
            exit 0
          fi

          echo "count=$(wc -l <out/found)" >>"$GITHUB_OUTPUT"

      - name: Open issues
        if: steps.scan.outputs.count != ''
        env:
          GH_TOKEN: ${{ secrets.BOT }}
        run: |
          set -euo pipefail

          workflow_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/workflows/scan.yml"

          while read -r pkg old new; do
            # One issue per package: autobump.yml is triggered per issue, so a
            # shared table would make every issue bump every package.
            cat >out/issue.md <<EOF
          **Package:** \`$pkg\`

          A newer upstream release is available.

          | Current | Latest |
          |---|---|
          | \`$old\` | \`$new\` |

          Autobump opens a pull request for this automatically. Comment
          \`nobump\` here to dismiss it.

          _Opened by [\`scan.yml\`]($workflow_url)._
          EOF

            # Label after creation, not with --label: if the label is missing
            # `gh issue create --label` fails and a retry would file a second
            # copy of the same issue.
            issue=$(gh issue create \
              --repo "$GITHUB_REPOSITORY" \
              --title "package-update: $pkg $old -> $new" \
              --body-file out/issue.md)

            if ! gh issue edit "$issue" --repo "$GITHUB_REPOSITORY" \
              --add-label package-update 2>/dev/null; then
              echo "::warning::$pkg: could not apply the package-update label"
            fi

            echo "$pkg -> ${issue:-FAILED}"
          done <out/found

      - name: Summary
        run: |
          {
            echo "# Update scan"
            echo
            if [ -s out/found ]; then
              echo "| Package | Current | Latest |"
              echo "|---|---|---|"
              while read -r pkg old new; do
                echo "| \`$pkg\` | $old | **$new** |"
              done <out/found
            else
              echo "All whitelisted templates are up to date."
            fi
          } >>"$GITHUB_STEP_SUMMARY"
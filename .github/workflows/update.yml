name: update files
on:
  push:
    # Only regenerate mainline files on the default branch. Running on every
    # branch (autobump/feature branches included) would add "CI: update"
    # commits to PR branches and double up with concurrent build runs.
    branches:
      - OCO
    paths:
      - 'srcpkgs/**'
      - 'src/build.yml.in'
  workflow_dispatch:
# This workflow regenerates README.md + build.yml and pushes them back to the
# branch. Two problems if it ran freely:
#   1. Two runs on the same branch would both `git push` from the same base
#      and one would fail non-fast-forward.
#   2. Its push modifies .github/workflows/build.yml WHILE a "matrix build"
#      run of that file is in progress on the same ref. GitHub reacts to a
#      changed workflow file by CANCELLING the in-progress run, which is why
#      every templated push ended "cancelled" mid-upload.
# Join the same concurrency lane as the build workflow ('build-publish', see
# src/build.yml.in) with an unbounded queue, so the update only ever runs
# after the build finishes and its push can never cancel a build.
concurrency:
  group: 'build-publish'
  cancel-in-progress: false
  queue: max

permissions:
  contents: write
  actions: write
jobs:
  list-templates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.WORKFLOWS }}
          fetch-depth: 2

      # The checkout above is pinned to the SHA at event time. When this run
      # was queued behind an earlier "CI: update" commit, the branch tip has
      # already moved; fast-forward to it so ./ocoman -u starts from the
      # current tip and the push below stays a fast-forward.
      - name: Sync to latest branch tip
        run: |
          git pull --ff-only origin "${GITHUB_REF_NAME}" || true

      - name: Update repo
        run: ./ocoman -u

      - name: Regenerate and upload main page
        env:
          SURFER_TOKEN: ${{ secrets.SURFER_TOKEN }}
          SURFER_USER: ${{ secrets.SURFER_USER }}
          TOKEN: ${{ secrets.WORKFLOWS }}
        run: |
          set -e
          sudo apt-get install -y pandoc nodejs
          sudo npm -g install @cloudron/surfer
          ./ocoman -m
          echo "Published to https://repo.osowoso.org/" >> $GITHUB_STEP_SUMMARY

          git config --global user.name "oSoWoso-bot"
          git config --global user.email "mail@osowoso.org"
          # Fail loudly if any of these files is missing -- they are all
          # regenerated by `ocoman -u` and a missing one means a bug.
          git add README.md .github/workflows/build.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "CI: update"
          git push
          git status

# Apply changes in src/build.yml.in instead.
# .github/workflows/build.yml is generated from this file by `ocoman -u`.

permissions:
  contents: write
  pull-requests: read
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  detect:
    name: Detect packages
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      packages: ${{ steps.detect.outputs.packages }}
      removed: ${{ steps.detect.outputs.removed }}
      matrix: ${{ steps.detect.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
        with:
          # Need full history so we can diff against arbitrary base SHAs
          # (multi-commit pushes, force-pushes, PR bases).
          fetch-depth: 0

      - name: Detect changed packages
        id: detect
        env:
          INPUT_ALL: ${{ inputs.all }}
          INPUT_TEMPLATE: ${{ inputs.template }}
          INPUT_TEMPLATES: ${{ inputs.templates }}
          INPUT_RUNNER: ${{ inputs.runner || 'auto' }}
          EVENT_NAME: ${{ github.event_name }}
          CURRENT_BRANCH: ${{ github.ref_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          . src/pkg-helpers.sh
          packages=""
          removed=""

          # Debug output
          echo "DEBUG: INPUT_ALL=$INPUT_ALL"
          echo "DEBUG: INPUT_TEMPLATE=$INPUT_TEMPLATE"
          echo "DEBUG: EVENT_NAME=$EVENT_NAME"
          echo "DEBUG: CURRENT_BRANCH=$CURRENT_BRANCH"
          echo "DEBUG: PUSH_BEFORE=$PUSH_BEFORE"
          echo "DEBUG: PUSH_AFTER=$PUSH_AFTER"
          echo "DEBUG: BASE_SHA=$BASE_SHA"
          echo "DEBUG: HEAD_SHA=$HEAD_SHA"

          ZERO_SHA="0000000000000000000000000000000000000000"
          all_packages() {
            find srcpkgs -maxdepth 1 -mindepth 1 -type d -printf "%f " | sed 's/ $//'
          }

          if [ "$INPUT_ALL" = "true" ]; then
            packages=$(all_packages)
          elif [ -n "$INPUT_TEMPLATE" ]; then
            packages="$INPUT_TEMPLATE"
          elif [ -n "$INPUT_TEMPLATES" ]; then
            packages=$(printf '%s ' $INPUT_TEMPLATES | sed 's/ $//')
          elif [ "$EVENT_NAME" = "push" ] || [ "$EVENT_NAME" = "pull_request" ]; then
            if [ "$EVENT_NAME" = "pull_request" ]; then
              BASE_SHA="$PR_BASE_SHA"
              HEAD_SHA="$PR_HEAD_SHA"
            else
              HEAD_SHA="$PUSH_AFTER"
              if [ "$CURRENT_BRANCH" = "OCO" ]; then
                if [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != "$ZERO_SHA" ] \
                    && git cat-file -e "$PUSH_BEFORE" 2>/dev/null; then
                  BASE_SHA="$PUSH_BEFORE"
                else
                  BASE_SHA=$(git rev-parse HEAD^ 2>/dev/null || echo "$ZERO_SHA")
                fi
              else
                BASE_SHA="$ZERO_SHA"
              fi
            fi
            if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "$ZERO_SHA" ] \
                || ! git cat-file -e "$BASE_SHA" 2>/dev/null; then
              echo "No direct diff base; reading origin/OCO .gitignore for package list"
              _main_list=$(git show origin/OCO:.gitignore 2>/dev/null | sed -n 's|^!/srcpkgs/\([^/]*\)/*$|\1|p' | sort -fu || true)
              if [ -n "$_main_list" ]; then
                _current_list=$(find srcpkgs -maxdepth 1 -mindepth 1 -type d -printf "%f\n" | sort -f)
                _added=$(  grep -Fxvf <(printf '%s\n' "$_main_list")    <(printf '%s\n' "$_current_list") || true)
                _removed=$(grep -Fxvf <(printf '%s\n' "$_current_list") <(printf '%s\n' "$_main_list")    || true)
                removed=$(printf '%s\n' "$_removed" | tr '\n' ' ' | sed 's/ $//')
                _common=$( grep -Fxf  <(printf '%s\n' "$_main_list")    <(printf '%s\n' "$_current_list") || true)
                _modified=""
                for _pkg in $_common; do
                  if git show origin/OCO:srcpkgs/$_pkg/template 2>/dev/null \
                      | diff -q - srcpkgs/$_pkg/template >/dev/null 2>&1; then
                    :
                  else
                    _modified="$_modified$_pkg "
                  fi
                done
                packages=$(printf '%s\n%s' "$_added" "$_modified" | grep -v '^$' | tr '\n' ' ' | sed 's/ $//')
              else
                echo "  Warning: origin/OCO:.gitignore empty or not found; building all packages"
                packages=$(all_packages)
              fi
            else
              _diff=$(git diff --name-status "$BASE_SHA" "$HEAD_SHA" -- 'srcpkgs/*/template')
              packages=$(printf '%s\n' "$_diff" \
                | awk '$1 ~ /^[ACMR]/ { if (substr($1,1,1)=="R") print $3; else print $2 }' \
                | cut -d/ -f2 | sort -u | tr '\n' ' ' | sed 's/ $//')
              removed=$(printf '%s\n' "$_diff" \
                | awk '$1=="D"{print $2} $1~/^R/{print $2}' \
                | cut -d/ -f2 | sort -u | tr '\n' ' ' | sed 's/ $//')
            fi
          else
            packages=$(all_packages)
          fi

          # Ensure packages is never empty - final fallback
          if [ -z "$packages" ]; then
            echo "  Warning: no packages detected, using all_packages fallback"
            packages=$(all_packages)
          fi

          echo "Packages: ${packages:-<none>}"
          echo "Removed: ${removed:-<none>}"
          echo "packages=$packages" >> "$GITHUB_OUTPUT"
          echo "removed=$removed" >> "$GITHUB_OUTPUT"
          repo="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          ref="${GITHUB_REF_NAME//\//%2F}"
          echo "| Package | version | template |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---------|---------|----------|" >> "$GITHUB_STEP_SUMMARY"
          for pkg in $packages; do
            version=$(grep '^version=' "srcpkgs/${pkg}/template" | cut -d '=' -f2)
            echo "| $pkg | $version | [template](${repo}/blob/${ref}/srcpkgs/${pkg}/template) |" >> "$GITHUB_STEP_SUMMARY"
          done
          if [ -n "$removed" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "### Removed" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            for pkg in $removed; do
              echo "$pkg" >> "$GITHUB_STEP_SUMMARY"
            done
          fi

          arch_needed() {
            local target="$1"
            for pkg in $packages; do
              pkg_arch_ok "$pkg" "$target" && return 0
            done
            return 1
          }

          needs_cross_aarch64() {
            _cnc_visited=""
            local any_nocross=0
            for pkg in $packages; do
              local template="srcpkgs/${pkg}/template"
              [ -f "$template" ] || continue
              pkg_arch_ok "$pkg" "aarch64" || continue
              _check_nocross_chain "$pkg" && any_nocross=1
            done
            [ "$any_nocross" = 0 ] && arch_needed "aarch64"
          }

          needs_cross_aarch64_musl() {
            _cnc_visited=""
            local any_nocross=0
            for pkg in $packages; do
              local template="srcpkgs/${pkg}/template"
              [ -f "$template" ] || continue
              pkg_arch_ok "$pkg" "aarch64-musl" || continue
              _check_nocross_chain "$pkg" && any_nocross=1
            done
            [ "$any_nocross" = 0 ] && arch_needed "aarch64-musl"
          }

          needs_native_aarch64() {
            _cnc_visited=""
            for pkg in $packages; do
              local template="srcpkgs/${pkg}/template"
              [ -f "$template" ] || continue
              _check_nocross_chain "$pkg" || continue
              pkg_arch_ok "$pkg" "aarch64" && return 0
            done
            return 1
          }

          needs_native_aarch64_musl() {
            _cnc_visited=""
            for pkg in $packages; do
              local template="srcpkgs/${pkg}/template"
              [ -f "$template" ] || continue
              _check_nocross_chain "$pkg" || continue
              pkg_arch_ok "$pkg" "aarch64-musl" && return 0
            done
            return 1
          }

          add_cfg() {
            [ -n "$matrix_configs" ] && matrix_configs="${matrix_configs},"
            matrix_configs="${matrix_configs}{\"arch\":\"$1\",\"host\":\"$2\",\"runner\":\"$3\",\"platform\":\"$4\",\"test\":$5,\"native\":$6}"
          }

          _RUNNER="${INPUT_RUNNER:-auto}"
          case "$_RUNNER" in
            amd64)
              _amd64=$(arch_needed "x86_64"       && echo 1 || echo 0)
              _musl=$( arch_needed "x86_64-musl"  && echo 1 || echo 0)
              matrix_configs=""
              [ "$_amd64" = 1 ] && add_cfg "x86_64"      "x86_64" "ubuntu-latest"    "linux/amd64" 1 false
              [ "$_musl"  = 1 ] && add_cfg "x86_64-musl" "x86_64" "ubuntu-latest"    "linux/amd64" 1 false
              if [ -z "$matrix_configs" ]; then
                echo "Warning: no packages for amd64 archs, defaulting to x86_64" >> "$GITHUB_STEP_SUMMARY"
                add_cfg "x86_64" "x86_64" "ubuntu-latest" "linux/amd64" 1 false
              fi
              ;;
            arm64)
              _arm_native=$(arch_needed "aarch64"      && echo 1 || echo 0)
              _arm_musl=$(   arch_needed "aarch64-musl" && echo 1 || echo 0)
              matrix_configs=""
              [ "$_arm_native" = 1 ] && add_cfg "aarch64"      "aarch64"      "ubuntu-24.04-arm" "linux/arm64" 1 true
              [ "$_arm_musl"  = 1 ] && add_cfg "aarch64-musl" "aarch64-musl" "ubuntu-24.04-arm" "linux/arm64" 1 true
              if [ -z "$matrix_configs" ]; then
                echo "Warning: no packages for arm64 archs, defaulting to x86_64" >> "$GITHUB_STEP_SUMMARY"
                add_cfg "x86_64" "x86_64" "ubuntu-latest" "linux/amd64" 1 false
              fi
              ;;
            nativ)
              matrix_configs=""
              arch_needed "x86_64"       && add_cfg "x86_64"       "x86_64" "ubuntu-latest"    "linux/amd64" 1 false
              arch_needed "aarch64"      && add_cfg "aarch64"      "aarch64" "ubuntu-24.04-arm" "linux/arm64" 1 true
              arch_needed "x86_64-musl"  && add_cfg "x86_64-musl"  "x86_64" "ubuntu-latest"    "linux/amd64" 1 false
              arch_needed "aarch64-musl" && add_cfg "aarch64-musl" "aarch64-musl" "ubuntu-24.04-arm" "linux/arm64" 1 true
              if [ -z "$matrix_configs" ]; then
                echo "Warning: no packages for any arch, defaulting to x86_64" >> "$GITHUB_STEP_SUMMARY"
                add_cfg "x86_64" "x86_64" "ubuntu-latest" "linux/amd64" 1 false
              fi
              ;;
            auto|*)
              matrix_configs=""
              arch_needed "x86_64"       && add_cfg "x86_64"       "x86_64" "ubuntu-latest"    "linux/amd64" 1 false
              needs_cross_aarch64      && add_cfg "aarch64"      "x86_64" "ubuntu-latest"    "linux/amd64" 0 false
              arch_needed "x86_64-musl"  && add_cfg "x86_64-musl"  "x86_64" "ubuntu-latest"    "linux/amd64" 1 false
              needs_cross_aarch64_musl && add_cfg "aarch64-musl" "x86_64" "ubuntu-latest"    "linux/amd64" 0 false
              needs_native_aarch64 && add_cfg "aarch64" "aarch64" "ubuntu-24.04-arm" "linux/arm64" 1 true
              needs_native_aarch64_musl && add_cfg "aarch64-musl" "aarch64-musl" "ubuntu-24.04-arm" "linux/arm64" 1 true
              if [ -z "$matrix_configs" ]; then
                echo "Warning: no arch matched package list, defaulting to x86_64" >> "$GITHUB_STEP_SUMMARY"
                add_cfg "x86_64" "x86_64" "ubuntu-latest" "linux/amd64" 1 false
              fi
              ;;
          esac
          echo "matrix={\"config\":[${matrix_configs}]}" >> "$GITHUB_OUTPUT"

  test-pr:
    name: Test PR changes
    needs: detect
    if: github.event_name == 'pull_request' && needs.detect.outputs.packages != ''
    runs-on: ${{ matrix.config.runner }}
    container:
      image: ghcr.io/osowoso/oco-builder-${{ matrix.config.host }}:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --platform ${{ matrix.config.platform }} --privileged
      volumes:
        - /dev:/dev
      env:
        ARCH: '${{ matrix.config.arch }}'
        BOOTSTRAP: '${{ matrix.config.host }}'
        TEST: '${{ matrix.config.test }}'
        NATIVE: '${{ matrix.config.native }}'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect.outputs.matrix) }}

    steps:
      - name: Prepare container
        run: |
          xbps-install -Syu xbps
          xbps-install -yu
          sudo -Eu builder git -C /void-packages pull --ff-only
          sudo -Eu builder sh -c "cd /void-packages && ./xbps-src bootstrap-update"

      - name: Checkout repo (PR head)
        run: |
          git clone "https://github.com/${{ github.repository }}.git" extra
          cd extra
          git fetch --no-tags origin "${{ github.event.pull_request.head.sha }}" --depth 1
          git checkout --detach "${{ github.event.pull_request.head.sha }}"

      - name: Merge templates and edit shlibs
        run: |
          SHLIBS_FILE=/void-packages/common/shlibs extra/ocoman -l

          echo "==> Copying templates..."
          for template in extra/srcpkgs/*; do
            template_name=$(basename "$template")
            rm -rf "/void-packages/srcpkgs/$template_name"
            cp -rv "$template" /void-packages/srcpkgs/
          done
          chown -R builder:builder /void-packages/srcpkgs /void-packages/common

      - name: Lint templates
        if: matrix.config.arch == 'x86_64'
        continue-on-error: true
        env:
          PACKAGES: ${{ needs.detect.outputs.packages }}
        run: |
          export PATH="/opt/xbps/usr/bin/:$PATH"
          packages="$PACKAGES"
          cd /void-packages

          for template_name in $packages; do
            echo "==> Linting ${template_name}"
            OUTPUT=$(sudo -Eu builder xlint "${template_name}" 2>&1) || true
            if [ -n "$OUTPUT" ]; then
              echo "❌ ${template_name} lint failed:" >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
              echo "$OUTPUT" >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
              echo "❌ ${template_name}: $OUTPUT"
            else
              echo "✅ ${template_name} lint passed"
            fi
          done

      - name: Build packages
        env:
          PACKAGES: ${{ needs.detect.outputs.packages }}
        run: sh "${GITHUB_WORKSPACE}/extra/src/build-packages.sh"

  build:
    name: Build and publish packages
    needs: detect
    if: (github.event_name == 'push' || github.event_name == 'repository_dispatch' || github.event_name == 'workflow_dispatch') && (needs.detect.outputs.packages != '' || needs.detect.outputs.removed != '')
    runs-on: ${{ matrix.config.runner }}
    container:
      image: ghcr.io/osowoso/oco-builder-${{ matrix.config.host }}:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --platform ${{ matrix.config.platform }} --privileged
      volumes:
        - /dev:/dev
      env:
        ARCH: '${{ matrix.config.arch }}'
        BOOTSTRAP: '${{ matrix.config.host }}'
        TEST: '${{ matrix.config.test }}'
        NATIVE: '${{ matrix.config.native }}'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect.outputs.matrix) }}

    steps:
      - name: Prepare container
        run: |
          xbps-install -Syu xbps
          xbps-install -yu
          sudo -Eu builder git -C /void-packages pull --ff-only
          sudo -Eu builder sh -c "cd /void-packages && ./xbps-src bootstrap-update"

      - name: Checkout this repo
        run: |
          git clone "https://github.com/${{ github.repository }}.git" extra
          cd extra
          git fetch --no-tags origin "${{ github.sha }}" --depth 1
          git checkout --detach "${{ github.sha }}"

      - name: Merge templates and edit shlibs
        run: |
          SHLIBS_FILE=/void-packages/common/shlibs extra/ocoman -l

          echo "==> Copying templates..."
          for template in extra/srcpkgs/*; do
            template_name=$(basename "$template")
            rm -rf "/void-packages/srcpkgs/$template_name"
            cp -rv "$template" /void-packages/srcpkgs/
          done
          chown -R builder:builder /void-packages/srcpkgs /void-packages/common

      - name: Snapshot existing packages
        if: needs.detect.outputs.packages != ''
        run: |
          ls /void-packages/hostdir/binpkgs/*.xbps 2>/dev/null | xargs -r -n1 basename > /tmp/pre-build-pkgs.txt || touch /tmp/pre-build-pkgs.txt

      - name: Build packages
        id: build
        if: needs.detect.outputs.packages != ''
        env:
          PACKAGES: ${{ needs.detect.outputs.packages }}
        run: sh "${GITHUB_WORKSPACE}/extra/src/build-packages.sh"

      - name: Sign and upload new packages
        if: steps.build.outputs.built == 'true'
        env:
          ARCH: ${{ matrix.config.arch }}
          PRIV_KEY: ${{ secrets.PRIV_KEY }}
          XBPS_ARCH: ${{ matrix.config.arch }}
          XBPS_TARGET_ARCH: ${{ matrix.config.arch }}
          SURFER_TOKEN: ${{ secrets.SURFER_TOKEN }}
        working-directory: /void-packages/hostdir/binpkgs/
        run: |
          export PATH="/opt/xbps/usr/bin/:$PATH"
          export XBPS_TARGET_ARCH="${XBPS_ARCH}"

          echo "==> Merging free + nonfree"
          [ -d nonfree ] && mv nonfree/*.xbps . 2>/dev/null || true

          echo "==> Identifying newly built packages"
          NEW_PKGS_DIR=$(mktemp -d)
          for pkg in ./*.xbps; do
            [ -f "$pkg" ] || continue
            base=$(basename "$pkg")
            grep -qxF "$base" /tmp/pre-build-pkgs.txt && continue
            mv "$pkg" "$NEW_PKGS_DIR/"
            [ -f "${pkg}.sig2" ] && mv "${pkg}.sig2" "$NEW_PKGS_DIR/" || true
          done

          if ! ls "$NEW_PKGS_DIR"/*.xbps 2>/dev/null; then
            echo "==> No new packages to sign/upload"
            rm -rf "$NEW_PKGS_DIR"
            exit 0
          fi

          echo "==> New packages: $(ls "$NEW_PKGS_DIR"/*.xbps | wc -l)"
          trap 'rm -f /tmp/private.pem' EXIT INT TERM
          ( umask 077 && printf '%s\n' "$PRIV_KEY" > /tmp/private.pem )

          echo "==> Signing new packages"
          xbps-rindex -S --privkey /tmp/private.pem "$NEW_PKGS_DIR"/*.xbps
          rm -f /tmp/private.pem

          BUILDDIR="$NEW_PKGS_DIR" "${GITHUB_WORKSPACE}/extra/ocoman" -p

      - name: Prune removed packages
        if: needs.detect.outputs.removed != ''
        env:
          ARCH: ${{ matrix.config.arch }}
          XBPS_ARCH: ${{ matrix.config.arch }}
          XBPS_TARGET_ARCH: ${{ matrix.config.arch }}
          SURFER_TOKEN: ${{ secrets.SURFER_TOKEN }}
          PRIV_KEY: ${{ secrets.PRIV_KEY }}
        run: |
          export PATH="/opt/xbps/usr/bin/:$PATH"
          export XBPS_TARGET_ARCH="${XBPS_ARCH}"
          "${GITHUB_WORKSPACE}/extra/ocoman" -p
          echo "Pruned from https://repo.osowoso.org/${ARCH}/" >> $GITHUB_STEP_SUMMARY

      - name: Regenerate arch page
        if: steps.build.outputs.built == 'true'
        env:
          ARCH: ${{ matrix.config.arch }}
          SURFER_TOKEN: ${{ secrets.SURFER_TOKEN }}
        run: |
          "${GITHUB_WORKSPACE}/extra/ocoman" -a

name: matrix build
run-name: >-
  ${{
    github.event_name == 'workflow_dispatch' &&
    (inputs.all == 'true' && 'build: all packages' ||
     inputs.template != '' && format('build: {0}', inputs.template) ||
     inputs.templates != '' && format('build: {0}', inputs.templates)) ||
    github.event_name == 'push' && github.event.head_commit.message ||
    github.event_name == 'pull_request' &&
    format('{0} (#{1})', github.event.pull_request.title, github.event.pull_request.number) ||
    'matrix build'
  }}

on:
  push:
    branches:
      - '**'
      - '!WIP'
      - '!WIP/**'
    paths:
      - 'srcpkgs/**'
  pull_request:
    paths:
      - 'srcpkgs/**'
  repository_dispatch:
    types: [build]
  workflow_dispatch:
    inputs:
      runner:
        description: 'Runner'
        required: false
        type: choice
        default: auto
        options:
        - auto
        - amd64
        - arm64
        - nativ
      all:
        description: 'Everything'
        required: false
        default: false
        type: boolean

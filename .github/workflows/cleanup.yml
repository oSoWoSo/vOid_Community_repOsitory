name: Cleanup repository

on:
  workflow_call:
    inputs:
      packages:
        description: >-
          Space-separated package names to strip from the repo index. Used by
          build.yml when a push deleted srcpkgs/* templates. Empty (scheduled
          runs) means "strip every package that has no template in srcpkgs/".
        required: false
        type: string
        default: ''
  schedule:
    - cron: '0 4 * * 0'
  workflow_dispatch:
    inputs:
      packages:
        description: >-
          Space-separated package names to strip from the repo index.
          Empty = auto-detect packages without a template in srcpkgs/.
        required: false
        default: ''

permissions:
  contents: read
  packages: read

jobs:
  cleanup:
    name: ${{ matrix.arch }}
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/osowoso/oco-builder-x86_64:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, x86_64-musl, aarch64, aarch64-musl]
    env:
      ARCH: ${{ matrix.arch }}

    steps:
      - name: Checkout this repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Strip removed packages from remote repodata
        env:
          SURFER_TOKEN: ${{ secrets.SURFER_TOKEN }}
          SURFER_USER: ${{ secrets.SURFER_USER }}
          PRIV_KEY: ${{ secrets.PRIV_KEY }}
          SURF_PURGE_PACKAGES: ${{ inputs.packages }}
        run: |
          set -eu
          export PATH="/opt/xbps/usr/bin/:$PATH"
          command -v xbps-rindex >/dev/null 2>&1 || { echo "xbps-rindex not found in builder image" >&2; exit 1; }
          # Republish a repodata that no longer advertises removed packages.
          # With the defaults here (SURF_SKIP_DELETE=1, SURF_DELETE_ORPHANS=0)
          # NO WebDAV DELETE: Surfer 7 crashes the app on every DELETE
          ./ocoman -p ${{ matrix.arch }}

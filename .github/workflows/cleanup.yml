name: Cleanup repository

on:
  workflow_call:
    inputs:
      packages:
        description: >-
          Space-separated package names to strip from the repo index
          Empty = auto-detect packages without a template
        required: false
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      packages:
        description: >-
          Space-separated package names to strip from the repo index
          Empty = auto-detect packages without a template
        required: false
        default: ''

permissions:
  contents: read
  packages: read

jobs:
  cleanup:
    name: ${{ matrix.arch }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: ghcr.io/osowoso/oco-builder-x86_64:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, x86_64-musl, aarch64, aarch64-musl]
    env:
      ARCH: ${{ matrix.arch }}

    steps:
      - name: Checkout this repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # `ocoman -p` does the whole purge by itself: it fetches the remote
      # repodata, deletes orphan .xbps/.sig2 files, strips the removed names
      # out of index.plist, re-signs and uploads the index. Do NOT download
      # ${ARCH}-repodata here -- there is no ${ARCH}-repodata.sig2 on the
      # server (xbps-rindex -s embeds the signature in stage.plist), so any
      # step that fetches one fails with 404.
      - name: Purge removed packages from repodata
        env:
          SURFER_TOKEN: ${{ secrets.SURFER_TOKEN }}
          SURFER_USER: ${{ secrets.SURFER_USER }}
          PRIV_KEY: ${{ secrets.PRIV_KEY }}
          SURF_PURGE_PACKAGES: ${{ inputs.packages }}
        run: |
          set -eu
          export PATH="/opt/xbps/usr/bin/:$PATH"
          command -v xbps-rindex >/dev/null 2>&1 || { echo "::error::xbps-rindex not found in builder image" >&2; exit 1; }
          command -v surfer >/dev/null 2>&1 || { echo "::error::surfer CLI not found in builder image" >&2; exit 1; }
          # ARCH comes from the job env; `ocoman -p` takes no argument and
          # must run from the checkout so it finds src/ and srcpkgs/. It
          # only reads BUILDDIR to pick up freshly built .xbps files; this
          # job builds nothing, so point it at an empty directory.
          mkdir -p "${RUNNER_TEMP}/empty"
          BUILDDIR="${RUNNER_TEMP}/empty" ./ocoman -p

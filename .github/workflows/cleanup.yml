name: Cleanup repository

on:
  workflow_call:
    inputs:
      packages:
        description: >-
          Space-separated package names to strip from the repo index
          Empty = auto-detect packages without a template
        required: false
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      packages:
        description: >-
          Space-separated package names to strip from the repo index
          Empty = auto-detect packages without a template
        required: false
        default: ''

permissions:
  contents: read
  packages: read

jobs:
  cleanup:
    name: ${{ matrix.arch }}
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/osowoso/oco-builder-x86_64:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, x86_64-musl, aarch64, aarch64-musl]
    env:
      ARCH: ${{ matrix.arch }}

    steps:
      - name: Checkout this repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Strip removed packages from remote repodata
        env:
          SURFER_TOKEN: ${{ secrets.SURFER_TOKEN }}
          SURFER_USER: ${{ secrets.SURFER_USER }}
          PRIV_KEY: ${{ secrets.PRIV_KEY }}
          SURF_PURGE_PACKAGES: ${{ inputs.packages }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -eu
          SFLAGS="-s repo.osowoso.org -u ${SURFER_USER} -p ${SURFER_TOKEN}"
          mkdir -p /work
          for _f in "${ARCH}-repodata" "${ARCH}-repodata.sig2"; do
            surfer $SFLAGS get "${ARCH}/${_f}" > "/work/${_f}" 2>/dev/null || \
              { echo "::error::failed to fetch ${_f}" >&2; exit 1; }
          done

      - name: Determine stale package versions
        id: decide
        env:
          ARCH: ${{ matrix.arch }}
        working-directory: /work
        run: |
          set -eu
          export PATH="/opt/xbps/usr/bin/:$PATH"
          command -v xbps-rindex >/dev/null 2>&1 || { echo "xbps-rindex not found in builder image" >&2; exit 1; }
          # ARCH comes from the job env, `ocoman -p` takes no argument.
          ./ocoman -p
